name: Deploy site

# Publishes main to the root of the gh-pages branch, which GitHub Pages
# serves (Settings → Pages → Deploy from branch → gh-pages → / (root)).
# PR previews live alongside it under pr-preview/ and are left untouched.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Deploys queue only behind other deploys. Sharing a group with pr-preview.yml
# let a PR's "closed" preview run replace the pending deploy when a merge
# landed, so the push to main was cancelled and never published. A replaced
# deploy is harmless here, since each one publishes the latest main.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
