name: Deploy site

# Publishes main to the root of the gh-pages branch, which GitHub Pages
# serves (Settings → Pages → Deploy from branch → gh-pages → / (root)).
# PR previews live alongside it under pr-preview/ and are left untouched.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
