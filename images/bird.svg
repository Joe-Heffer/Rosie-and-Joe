<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 32 16">
  <!-- A single pen-stroke bird in the sketch's sepia ink, wings beating
       slowly. Used by .hero__bird on the home page hero. -->
  <style>
    path {
      fill: none;
      stroke: #5B4E42;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform-box: view-box;
      transform-origin: 16px 9px;
      animation: 0.9s ease-in-out infinite alternate;
    }
    .l { animation-name: flap-l; }
    .r { animation-name: flap-r; }
    @keyframes flap-l {
      from { transform: rotate(-14deg); }
      to { transform: rotate(26deg) scaleY(0.7); }
    }
    @keyframes flap-r {
      from { transform: rotate(14deg); }
      to { transform: rotate(-26deg) scaleY(0.7); }
    }
    @media (prefers-reduced-motion: reduce) {
      path { animation: none; }
    }
  </style>
  <path class="l" d="M16 9C13 4 7 3 2 6"/>
  <path class="r" d="M16 9C19 4 25 3 30 6"/>
</svg>
