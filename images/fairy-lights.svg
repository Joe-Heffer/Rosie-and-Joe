<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768">
  <!-- Twinkle overlay for images/barn-hall-watercolour.jpg: one glowing bulb
       per fairy light, in the painting's own pixel coordinates, so it lines
       up when used as a background with the same size and position. Each
       bulb has a soft amber shadow behind it so it reads against the pale
       paper. -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#7A4A16" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#7A4A16" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7A4A16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFE7A6"/>
      <stop offset="0.3" stop-color="#F7C960" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#EFAE3A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#EFAE3A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .h { fill: url(#halo); }
    .g { fill: url(#glow); }
    .c { fill: #FFFCF0; }
    .b {
      opacity: 0.3;
      transform-box: fill-box;
      transform-origin: center;
      animation: glow ease-in-out infinite;
    }
    .b.s { animation-name: sparkle; }
    @keyframes glow {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes sparkle {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
      68% { opacity: 1; transform: scale(1.35); }
      76% { opacity: 0.45; transform: scale(0.9); }
      82% { opacity: 0.95; transform: scale(1.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .b { animation: none; opacity: 0.7; transform: none; }
    }
  </style>
