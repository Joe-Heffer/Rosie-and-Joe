<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768">
  <!-- Twinkle overlay for images/barn-hall-watercolour.jpg: one soft glow per
       fairy-light bulb, in the painting's own pixel coordinates, so it lines
       up when used as a background with the same size and position. -->
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFFDF4"/>
      <stop offset="0.22" stop-color="#FFF4D2"/>
      <stop offset="0.55" stop-color="#F7DB98" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F2CF7E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    circle {
      fill: url(#glow);
      opacity: 0.2;
      animation: glow ease-in-out infinite;
    }
    circle.s { animation-name: sparkle; }
    @keyframes glow {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.85; }
    }
    @keyframes sparkle {
      0%, 70%, 100% { opacity: 0.2; }
      78% { opacity: 1; }
      86% { opacity: 0.35; }
    }
    @media (prefers-reduced-motion: reduce) {
      circle { animation: none; opacity: 0.5; }
    }
  </style>
