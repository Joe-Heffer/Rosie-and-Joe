<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>RSVP — Rosie &amp; Joe</title>
    <meta
      name="description"
      content="RSVP to Rosie and Joe's wedding on 17 April 2027."
    />

    <!-- Open Graph / Twitter Card: link preview when shared (e.g. WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rosie &amp; Joe" />
    <meta property="og:title" content="RSVP — Rosie &amp; Joe" />
    <meta
      property="og:description"
      content="RSVP to Rosie and Joe's wedding on 17 April 2027."
    />
    <meta property="og:url" content="https://rosieandjoe.uk/rsvp.html" />
    <meta property="og:image" content="https://rosieandjoe.uk/images/eyam-hall-open-graph-watercolour.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RSVP — Rosie &amp; Joe" />
    <meta
      name="twitter:description"
      content="RSVP to Rosie and Joe's wedding on 17 April 2027."
    />
    <meta name="twitter:image" content="https://rosieandjoe.uk/images/eyam-hall-open-graph-watercolour.jpg" />

    <!-- Google Fonts: Cormorant (Light Italic display) + Cormorant SC (labels)
       + Spectral (body) + Jost (utility) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+SC:wght@300;400&family=Spectral:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <meta name="theme-color" content="#A94A68" />
    <script src="js/components.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <site-header></site-header>

    <main id="main">
      <div class="page-header reveal">
        <span class="eyebrow">RSVP</span>
        <h1>Will You Join Us?</h1>
        <p>
          We can't wait to celebrate with you. Please let us know whether you
          can make it by <strong>Saturday 16 January 2027</strong> using the
          form below.
        </p>
        <p>
          Only invited to the evening reception? Please use the
          <a href="evening/#rsvp">evening RSVP form</a> instead.
        </p>
        <svg class="vignette vignette--envelope" viewBox="0 0 120 80" aria-hidden="true" focusable="false">
          <g transform="translate(22 22)"><path class="vignette__sparkle" d="M0 -5 L1 -1 L5 0 L1 1 L0 5 L-1 1 L-5 0 L-1 -1 Z" /></g>
          <g transform="translate(100 30)"><path class="vignette__sparkle vignette__sparkle--late" d="M0 -5 L1 -1 L5 0 L1 1 L0 5 L-1 1 L-5 0 L-1 -1 Z" /></g>
          <g transform="translate(72 22)"><path class="vignette__heart vignette__heart--float" d="M0 5 C-6 0 -5 -5 -2 -5 C-0.8 -5 0 -4 0 -3 C0 -4 0.8 -5 2 -5 C5 -5 6 0 0 5 Z" /></g>
          <g transform="translate(48 26)"><path class="vignette__heart vignette__heart--float vignette__heart--late" d="M0 5 C-6 0 -5 -5 -2 -5 C-0.8 -5 0 -4 0 -3 C0 -4 0.8 -5 2 -5 C5 -5 6 0 0 5 Z" /></g>
          <g class="vignette__envelope">
            <rect class="vignette__paper" x="30" y="34" width="60" height="38" />
            <path class="vignette__flap vignette__flap--open" d="M30 34 L60 14 L90 34" />
            <g class="vignette__letter">
              <rect class="vignette__paper" x="38" y="12" width="44" height="34" />
              <path d="M44 22 H76 M44 28 H72 M44 34 H66" />
            </g>
            <path class="vignette__paper" d="M30 38 L60 58 L90 38 V72 H30 Z" />
            <path class="vignette__paper vignette__flap vignette__flap--closed" d="M30 34 L60 56 L90 34 Z" />
            <g transform="translate(60 54)"><path class="vignette__heart vignette__seal" d="M0 5 C-6 0 -5 -5 -2 -5 C-0.8 -5 0 -4 0 -3 C0 -4 0.8 -5 2 -5 C5 -5 6 0 0 5 Z" /></g>
          </g>
        </svg>
      </div>

      <section class="section section--alt reveal">
        <div class="container">
          <div class="embed">
            <div class="embed__frame">
              <iframe
                src="https://docs.google.com/forms/d/e/1FAIpQLSd212eAd0eDGJOYvhtMEv9YTyGXgG5GDgC9-brmLE3mpBcP6w/viewform?embedded=true"
                width="100%"
                height="900"
                frameborder="0"
                marginheight="0"
                marginwidth="0"
                title="Wedding RSVP form"
                >Loading…</iframe
              >
            </div>
          </div>
        </div>
      </section>

      <!-- Ceremony image — watercolour of the Flagged Hall laid out for the
      ceremony: chairs with rose posies either side of a petal-strewn aisle,
      leading to the garlanded fireplace. -->
      <figure class="figure figure--bleed reveal">
        <img
          class="figure__img"
          src="images/eyam-hall-flagged-hall-watercolour.jpg"
          alt="Watercolour of the Flagged Hall at Eyam Hall set for the ceremony: rows of chairs tied with rose posies either side of a petal-strewn aisle, leading to a fireplace hung with a floral garland."
          loading="lazy"
        />
        <figcaption class="figure__caption">
          The Flagged Hall &middot; Eyam Hall's inside ceremony space
        </figcaption>
      </figure>

    </main>

    <site-footer></site-footer>

    <script src="js/main.js"></script>
  </body>
</html>
