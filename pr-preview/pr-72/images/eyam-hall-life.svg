<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1301" viewBox="0 0 816 1301">
  <!-- Signs of life for images/eyam-hall-sketch.jpg, in the painting's own
       pixel coordinates, so it lines up when used as a background with the
       same size and position:
       * smoke curls up from two of the chimney pots and drifts on the breeze
       * pink petals drift down from the blossom tree on the left, the shrub
         below the door and the climbing roses, swaying and tumbling, then
         fade before they land
       * a pale yellow butterfly flits about the climbing roses by the door -->
  <defs>
    <radialGradient id="puff">
      <stop offset="0" stop-color="#8C8174" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#8C8174" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8C8174" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .p {
      opacity: 0;
      animation: fall-a linear infinite;
    }
    .p.b { animation-name: fall-b; }
    .p.c { animation-name: fall-c; }
    .p.d { animation-name: fall-d; }
    .r {
      transform-box: fill-box;
      transform-origin: center;
      animation: tumble linear infinite;
    }
    @keyframes tumble {
      0% { transform: rotate(0deg) scaleX(1); }
      50% { transform: rotate(180deg) scaleX(0.35); }
      100% { transform: rotate(360deg) scaleX(1); }
    }
    @keyframes fall-a {
      0% { opacity: 0; transform: translate(0, 0); }
      12% { opacity: 0.9; }
      35% { transform: translate(14px, 40px); }
      65% { transform: translate(-6px, 85px); }
      80% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(10px, 130px); }
    }
    @keyframes fall-b {
      0% { opacity: 0; transform: translate(0, 0); }
      12% { opacity: 0.9; }
      35% { transform: translate(-12px, 35px); }
      65% { transform: translate(10px, 80px); }
      80% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(-4px, 120px); }
    }
    @keyframes fall-c {
      0% { opacity: 0; transform: translate(0, 0); }
      12% { opacity: 0.9; }
      40% { transform: translate(22px, 45px); }
      70% { transform: translate(30px, 95px); }
      80% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(48px, 140px); }
    }
    @keyframes fall-d {
      0% { opacity: 0; transform: translate(0, 0); }
      12% { opacity: 0.9; }
      30% { transform: translate(8px, 28px); }
      60% { transform: translate(-14px, 70px); }
      80% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(-24px, 110px); }
    }
    .s {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: rise-a 8s linear infinite;
    }
    .s.b { animation-name: rise-b; }
    @keyframes rise-a {
      0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
      12% { opacity: 0.6; }
      35% { transform: translate(-2px, -20px) scale(1); }
      65% { opacity: 0.25; transform: translate(10px, -42px) scale(1.6); }
      100% { opacity: 0; transform: translate(26px, -66px) scale(2.2); }
    }
    @keyframes rise-b {
      0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
      12% { opacity: 0.6; }
      35% { transform: translate(3px, -22px) scale(1); }
      65% { opacity: 0.25; transform: translate(8px, -44px) scale(1.6); }
      100% { opacity: 0; transform: translate(30px, -62px) scale(2.2); }
    }
    .fly { animation: flit 26s ease-in-out infinite; }
    .bob { animation: bob 1.3s ease-in-out infinite alternate; }
    .w { animation: flap 0.22s ease-in-out infinite alternate; }
    @keyframes flit {
      0%, 100% { transform: translate(0, 0); }
      12% { transform: translate(24px, -16px); }
      22%, 30% { transform: translate(52px, -4px); }
      42% { transform: translate(66px, 26px); }
      55% { transform: translate(38px, 42px); }
      66%, 72% { transform: translate(8px, 30px); }
      85% { transform: translate(-16px, 8px); }
    }
    @keyframes bob {
      from { transform: translateY(-3px); }
      to { transform: translateY(3px); }
    }
    @keyframes flap {
      from { transform: scaleX(1); }
      to { transform: scaleX(0.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .p, .r, .s, .fly, .bob, .w { animation: none; }
    }
  </style>
