<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1301" viewBox="0 0 816 1301">
  <!-- Falling-blossom overlay for images/eyam-hall-sketch.jpg: pink petals
       drift down from the blossom tree on the left, the shrub below the door
       and the climbing roses, in the painting's own pixel coordinates, so it
       lines up when used as a background with the same size and position.
       Each petal falls, sways and tumbles, then fades before it lands. -->
  <style>
    .p {
      opacity: 0;
      animation: fall-a linear infinite;
    }
    .p.b { animation-name: fall-b; }
    .p.c { animation-name: fall-c; }
    .p.d { animation-name: fall-d; }
    .r {
      transform-box: fill-box;
      transform-origin: center;
      animation: tumble linear infinite;
    }
    @keyframes tumble {
      0% { transform: rotate(0deg) scaleX(1); }
      50% { transform: rotate(180deg) scaleX(0.35); }
      100% { transform: rotate(360deg) scaleX(1); }
    }
    @keyframes fall-a {
      0% { opacity: 0; transform: translate(0, 0); }
      12% { opacity: 0.9; }
      35% { transform: translate(14px, 40px); }
      65% { transform: translate(-6px, 85px); }
      80% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(10px, 130px); }
    }
    @keyframes fall-b {
      0% { opacity: 0; transform: translate(0, 0); }
      12% { opacity: 0.9; }
      35% { transform: translate(-12px, 35px); }
      65% { transform: translate(10px, 80px); }
      80% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(-4px, 120px); }
    }
    @keyframes fall-c {
      0% { opacity: 0; transform: translate(0, 0); }
      12% { opacity: 0.9; }
      40% { transform: translate(22px, 45px); }
      70% { transform: translate(30px, 95px); }
      80% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(48px, 140px); }
    }
    @keyframes fall-d {
      0% { opacity: 0; transform: translate(0, 0); }
      12% { opacity: 0.9; }
      30% { transform: translate(8px, 28px); }
      60% { transform: translate(-14px, 70px); }
      80% { opacity: 0.8; }
      100% { opacity: 0; transform: translate(-24px, 110px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .p, .r { animation: none; }
    }
  </style>
  <g class="p b" style="animation-duration:11.6s;animation-delay:-9.8s"><g transform="translate(78 770) scale(1.51)"><path class="r" style="fill:#EFC6CF;animation-duration:3.3s;animation-delay:-0.8s" d="M-4 0C-3-2.6 2-3 4 0C2 3-3 2.6-4 0Z"/></g></g>
